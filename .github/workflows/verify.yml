name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python package builds
        run: uv build packages/useful-agent
      - name: Python syntax
        run: python -m py_compile packages/useful-agent/src/useful_agent/cli.py
      - name: Secret/path scan
        run: |
          PATTERN='(/Users/a1|Desktop/.;L|Telegram bot token: [0-9]|client_secret|api_key|PRIVATE KEY)'
          ! grep -RInE "$PATTERN" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude='*.md'
