name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          github-token: ${{ github.token }}
      - name: Python package builds
        run: uv build packages/useful-agent
      - name: Python syntax
        run: python -m py_compile packages/useful-agent/src/useful_agent/cli.py modules/transcripted/transcripted-mcp modules/nanobot/patches/*.py scripts/secret_scan.py
      - name: Secret/path scan
        run: python scripts/secret_scan.py
      - name: Shell and plist syntax
        run: |
          zsh -n bootstrap/macos.sh modules/backups/templates/backup.sh modules/governance/check.sh modules/nanobot/templates/run-nanobot.sh
          plutil -lint modules/nanobot/templates/com.usefulaiagent.nanobot.plist
      - name: Menu bar Swift parse
        run: swiftc -parse apps/menu-bar/Sources/UsefulAgentMenuBar/main.swift
